                  # append-only and somebody else's row is not ours to discard.
                  if GIT_AUTH_TOKEN="${PAT_SECRET:-${GH_TOKEN:-}}" \
                       git -C "$vf_data" "${CRED_ARGS[@]}" fetch -q origin 2>/dev/null; then
                    git -C "$vf_data" rebase -q FETCH_HEAD >/dev/null 2>&1 \
                      || git -C "$vf_data" rebase --abort >/dev/null 2>&1 || true
                  fi
                  vf_try=$((vf_try+1))
                done
                if [ "$vf_pushed" != "1" ]; then
                  # Hand the row to finalize, which downloads every outcome-* artifact and
                  # owns the durable write. The fork exists under the bot account either way;
                  # what must not happen is that nothing records it.
                  VF_OUT="${OUTCOME_DIR:-${GITHUB_WORKSPACE:-$PWD}/_outcomes}"
                  mkdir -p "$VF_OUT"
                  printf '%s\n' "$vf_row" > "$VF_OUT/orphaned-fork.json"
                  echo "RELAY:orphaned-fork — the record could not be pushed from this job; finalize will persist it"
                  echo "WARN:orphan-record-unpushed — $VF_SLUG is orphaned AND its ledger record did not reach auditor-data from here; if finalize also fails, record it by hand (auditor/README.md)" >&2
                fi
              fi
              echo "REFUSE:fork-invariant:$vf_fail — $VF_SLUG recorded as orphaned_fork; NOT deleted, hand it to a human" >&2
              exit 1
            fi
            echo "FORK:verified — $VF_SLUG"
          fi
