          VF_REPO="${REPO:-$(jq -r '.repo // empty' "$VF_CTX" 2>/dev/null || true)}"
          if [ -n "$VF_SLUG" ]; then
            vf_fail=""
            vf_json="$(gh api "repos/$VF_SLUG" 2>/dev/null || true)"
            if [ -z "$vf_json" ]; then
              vf_fail="resolves"
            elif [ "$(printf '%s' "$vf_json" | jq -r '.fork // false')" != "true" ]; then
              vf_fail="is_fork"
            elif [ "$(printf '%s' "$vf_json" | jq -r '.full_name // ""')" != "$VF_SLUG" ]; then
              vf_fail="owner_matches"
            elif [ "$(printf '%s' "$vf_json" | jq -r '.parent.full_name // ""')" != "$VF_REPO" ]; then
              vf_fail="parent_matches"
