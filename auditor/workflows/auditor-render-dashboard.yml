# ported from the nlpm auditor at capability parity
# auditor-render-dashboard — render the cross-repo HTML dashboard from the
# append-only global logs and the registry, then commit it to the data branch.
# Daily at 22:30 UTC, deliberately chained 30 minutes after the daily report so
# that report's committed outputs are visible to the renderer. No model.
name: auditor-render-dashboard
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: optional ISO date; drop records older than this from the render
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: auditor-render-dashboard
  cancel-in-progress: false
env:
  CODE_DIR: ${{ github.workspace }}
  DATA_DIR: ${{ github.workspace }}/_data
  REGISTRY: ${{ github.workspace }}/_data/registry/repos.json
  EVENT_LOG: ${{ github.workspace }}/_data/ledgers/events.jsonl
  SINCE: ${{ github.event.inputs.since }}
  GH_TOKEN: ${{ github.token }}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      -   uses: actions/checkout@v4
          with:
            ref: auditor-data
            path: _data
            persist-credentials: false
      - name: Render the cross-repo dashboard
        run: |
          # Missing or empty logs degrade to zero counts rather than failing; the
          # docs subtree ships alongside so rule-id anchors never 404. Every ledger
          # read resolves the SCHEMAS section-7 envelope — the `since` cutoff compares
          # the envelope timestamp, payload fields live under `.data` — and the record
          # this step appends carries that same envelope so the file stays homogeneous.
          # logic:render-dashboard
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          [ -f "$REGISTRY" ] || { echo "REFUSE:registry-missing"; exit 1; }
          SINCE="${SINCE:-}"
          RUN_ID="${GITHUB_RUN_ID:-local}"
          RUN_NUMBER="${GITHUB_RUN_NUMBER:-0}"
          case "$RUN_NUMBER" in
            ''|*[!0-9]*) RUN_NUMBER=0 ;;
          esac
          REPORTS="$DATA_DIR/reports"
          DOCS="$REPORTS/docs"
          FINDING_LOG="$DATA_DIR/ledgers/findings.jsonl"
          VOCAB_LOG="$DATA_DIR/ledgers/vocab-advisories.jsonl"
          mkdir -p "$REPORTS"
          # vibe-167: every byte of dashboard and rule-docs HTML is render-dashboard.py's
          # duty. What stays here: the docs-clobber guard (the helper renders docs
          # unconditionally; a real docs build dropped in later must survive), the §7
          # envelope counts for the event, and the event append via the shared library.
          KEEP_DOCS=""
          if [ -f "$DOCS/index.html" ] && ! grep -qF -- "<!-- generated-by-auditor-render-dashboard -->" "$DOCS/index.html"; then
            KEEP_DOCS="$(mktemp)"
            cp "$DOCS/index.html" "$KEEP_DOCS"
          fi
          if [ -n "$SINCE" ]; then
            python3 "$CODE_DIR/auditor/scripts/render-dashboard.py" --data-dir "$DATA_DIR" --out "$REPORTS" --generated-at "$TS" --since "$SINCE"
          else
            python3 "$CODE_DIR/auditor/scripts/render-dashboard.py" --data-dir "$DATA_DIR" --out "$REPORTS" --generated-at "$TS"
          fi
          if [ -n "$KEEP_DOCS" ]; then
            cp "$KEEP_DOCS" "$DOCS/index.html"
            rm -f "$KEEP_DOCS"
          fi
          read_count() {
            [ -f "$1" ] || { echo 0; return 0; }
            jq -c --arg s "$SINCE" 'select(type == "object")
              | select($s == "" or ((.timestamp // "") >= $s))' "$1" 2> /dev/null | wc -l | tr -d ' ' || echo 0
          }
          FINDINGS="$(read_count "$FINDING_LOG")"
          ADVISORIES="$(read_count "$VOCAB_LOG")"
          EVENTS="$(read_count "$EVENT_LOG")"
          REPOS="$(jq '.repos | length' "$REGISTRY")"
          # §7 envelope via the shared event library — an adoption site (vibe-167)
          . "$CODE_DIR/auditor/scripts/log-event.sh"
          AUDITOR_DATA_DIR="$DATA_DIR" log_event auditor-render-dashboard dashboard_rendered "$(jq -cn --arg s "$SINCE" --argjson r "$REPOS" --argjson f "$FINDINGS" --argjson a "$ADVISORIES" --argjson e "$EVENTS" '{repos: $r, findings: $f, advisories: $a, events: $e, since: $s, report: "reports/dashboard.html"}')"
          echo "PASS"
          # /logic
      - run: |
          set -euo pipefail
          cd "$DATA_DIR"
          bash "$CODE_DIR/auditor/scripts/guard-protected-paths.sh"
          git add reports ledgers/events.jsonl
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "vibe-suite-auditor"
          git config user.email "auditor@users.noreply.github.com"
          git commit -m "auditor-render-dashboard refresh cross-repo dashboard"
          bash "$CODE_DIR/auditor/scripts/git-push-with-retry.sh"
