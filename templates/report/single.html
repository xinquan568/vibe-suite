<!doctype html>
<!-- SPDX-License-Identifier: ISC -->
<!--
  Per-repository audit report.

  Placeholders — substituted by auditor/scripts/render-repo-report.py, and ONLY these three:
    {{PROJECT}}       the audited repo, owner/name
    {{GENERATED_AT}}  ISO-8601 UTC timestamp
    {{DATA_JSON}}     the audit sidecar, inlined

  The previous version of this file used a different placeholder set entirely — G6_BUNDLE,
  SCORE_SECTION, RENDER_JS and friends — so the renderer substituted nothing and every report
  rendered with literal braces. It was replaced rather than extended.

  Those retired names are written WITHOUT braces on purpose: a tool scanning this file for
  placeholders would otherwise find them in the comment and try to substitute tokens the
  renderer does not supply.

  Data is INLINED, not fetched: these reports are read from disk and from artifact downloads
  as often as from a server, and a fetch would render an empty page there with no explanation.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit report — {{PROJECT}}</title>
<link rel="stylesheet" href="assets/vibe-report.css">
</head>
<body>
<main>
  <h1>{{PROJECT}}</h1>
  <p class="subtitle">Audited {{GENERATED_AT}}</p>

  <h2>Findings</h2>
  <div class="scroll">
    <table>
      <thead><tr><th>Severity</th><th>Rule</th><th>Location</th><th>Summary</th></tr></thead>
      <tbody id="findings"></tbody>
    </table>
  </div>

  <footer>
    Generated by vibe-suite. Findings are advisory; a human reviews every contribution.
  </footer>
</main>

<script type="application/json" id="audit-data">{{DATA_JSON}}</script>
<script src="assets/vibe-report.js"></script>
</body>
</html>
