          # previous run opened the PR and lost the ledger write. Reconcile it — the ONLY permitted
          # bypass of the duplicate-open-PR gate — and never call `gh pr create` again.
          ours="[]"
          if [ -f "$PATCH_META" ]; then
            ours=$(jq -c '[.[] | .fingerprint] | sort' "$PATCH_META" 2>/dev/null || echo '[]')
          fi
