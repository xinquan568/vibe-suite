              CRED_ARGS=()
              case "${PUSH_REMOTE_URL:-$(git -C "${PUSH_DIR:-.}" remote get-url origin 2>/dev/null)}" in
                https://*) : ;;
                *) PAT_SECRET="" ;;
              esac
              if [ -n "${PAT_SECRET:-${GH_TOKEN_HTTPS:-}}" ]; then
                CRED_ARGS=(-c 'credential.helper=' \
                  -c 'credential.helper=!f() { echo "username=x-access-token"; echo "password=${GIT_AUTH_TOKEN}"; }; f')
              fi
              if GIT_AUTH_TOKEN="${PAT_SECRET:-${GH_TOKEN:-}}" \
                 git "${CRED_ARGS[@]}" -C "$DATA_DIR" push -q origin "HEAD:${DATA_BRANCH:-auditor-data}" 2>/dev/null
              then
                pushed=1
              fi
            fi
          fi
          if [ "$pushed" != "1" ]; then
            echo "contribution_partial: PR #${PR_NUMBER:-unknown} is open but the ledger write did not land; no label is applied and the PR metadata block is the sole recovery record"
            jq -nc --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg repo "$REPO" \
              --argjson pr "${PR_NUMBER:-null}" --arg rid "$RUN_ID" --argjson rn "$RUN_NUMBER" \
              '{timestamp: $ts, workflow: "auditor-contribute", event: "contribution_partial",
                run_id: $rid, run_number: $rn, data: {repo: $repo, pr_number: $pr}}' >> "$EVENT_LOG"
            jq -n --argjson pr "${PR_NUMBER:-null}" \
              '{schema_version: 1, job: "submit", status: "partial-persisted",
                reason: "ledger-write-failed",
                ids: (if $pr == null then {} else {pr_number: $pr} end)}' > "$OUT/outcome-submit.json"
            echo "status=partial-persisted" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "OUTCOME:submit:partial-persisted"
            exit 1
          fi
          gh issue edit "$ISSUE" --repo "$OWN_REPO" \
            --remove-label contribute-approved --add-label prs-submitted
          jq -n --argjson pr "${PR_NUMBER:-null}" \
            '{schema_version: 1, job: "submit", status: "submitted", reason: "",
              ids: (if $pr == null then {} else {pr_number: $pr} end)}' > "$OUT/outcome-submit.json"
          {
            echo "status=submitted"
            echo "pr_number=$PR_NUMBER"
          } >> "${GITHUB_OUTPUT:-/dev/null}"
          echo "OUTCOME:submit:submitted"
          echo "PASS"
          # /stage-logic
          # /logic
        id: lifecycle
        env:
          PAT_SECRET: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ needs.reserve.outputs.repo }}
          DATA_DIR: _data
          OUTCOME_DIR: _outcomes
          PATCH_DIR: _patches
          TARGET_DIR: _target
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outcome-submit
          path: _outcomes/outcome-submit.json
          if-no-files-found: warn
      # F7: the orphan record's second chance. verify-fork writes this only when it could not
      # push the row itself; finalize downloads every outcome-* artifact and persists it. A
      # fork left under the bot account with no record anywhere is the state a human cannot
      # clean up, so one unlucky push must not be the end of it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outcome-orphaned-fork
          path: _outcomes/orphaned-fork.json
          if-no-files-found: ignore
  finalize:
    needs: [gates, reserve, propose, submit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      # F5: the disclosure set reaches finalize and nowhere else. It was uploaded and
      # never downloaded, so critical/high security findings could vanish while an ordinary
      # contribution proceeded.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gate-disclosure
          path: ${{ github.workspace }}
      # F1: NOT mandatory. gates refusing inside derive-context uploads no context at all, and
      # finalize is the only job that can route that refusal — label the tracking issue, write
      # the ledger row. A required download meant the reporting job died exactly when there was
      # something to report, and the named refusal reached nobody.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gate-context
          path: ${{ github.workspace }}
      - uses: actions/checkout@v4
        with:
          ref: auditor-data
          path: _data
      - uses: actions/download-artifact@v4
        with:
          path: _outcomes
          pattern: outcome-*
          merge-multiple: true
      # E8.2b (vibe-164) W6.3: the existing download matches only outcome-*, so the quota
      # facts the umbrella backstop needs never reached this job. The manifest carries them.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: proposal-manifest
          path: _gate
      - name: umbrella backstop for remaining findings
        env:
          REPO: ${{ needs.reserve.outputs.repo }}
          SUBMIT_RESULT: ${{ needs.submit.result }}
          TERMINAL_STATUS: ${{ needs.submit.outputs.status }}
        run: |
          # stage-logic:umbrella
          # Moved here from gates (W6.2): gates is read-only and held no issues: write.
          #
          # finalize runs `always()`, so "the job got here" says nothing about whether the run
          # succeeded. The trigger is therefore stated POSITIVELY and every condition is
          # checked, rather than inherited from job status:
          #
          #   quota_exhausted == true      the filter actually dropped work for the cap
          #   remaining_count  >  0        there is something left to track
          #   submit result == success     the run reached a terminal submit
          #   status in {submitted, conflict, partial-persisted}
          #
          # pre-pr-failure and error do NOT qualify: a run that never reached a PR has no
          # exhausted quota to report, and raising an umbrella there would tell a maintainer
          # we ran out of budget when in fact we broke.
          set -euo pipefail
          MANIFEST="${MANIFEST:-${GITHUB_WORKSPACE:-$PWD}/_gate/proposal-manifest.json}"
          [ -f "$MANIFEST" ] || { echo "no manifest — nothing to back off"; exit 0; }
          qe="$(jq -r '.quota_exhausted // false' "$MANIFEST" 2>/dev/null || echo false)"
          rem="$(jq -r '.remaining_count // 0' "$MANIFEST" 2>/dev/null || echo 0)"
          sr="${SUBMIT_RESULT:-}"
          st="${TERMINAL_STATUS:-}"
          if [ "$qe" != "true" ] || [ "${rem:-0}" -le 0 ]; then
            echo "umbrella: not triggered (quota_exhausted=$qe remaining=$rem)"; exit 0
          fi
          if [ "$sr" != "success" ]; then
            echo "umbrella: not triggered (submit result '$sr' is not success)"; exit 0
          fi
          case "$st" in
            submitted|conflict|partial-persisted) : ;;
            *) echo "umbrella: not triggered (terminal status '$st' never reached a PR)"; exit 0 ;;
          esac
          # Idempotency: a rerun of the same run must not open a second issue. The run id is
          # in the title precisely so this lookup can be exact.
          title="Umbrella: $rem remaining findings for $REPO (${GITHUB_RUN_ID:-local})"
          existing="$(gh issue list --repo xinquan568/vibe-suite --state open --json number,title 2>/dev/null || echo '[]')"
          if printf '%s' "$existing" | jq -e --arg t "$title" '.[]? | select(.title == $t)' >/dev/null 2>&1; then
            echo "umbrella: already open for this run; not duplicating"; exit 0
          fi
          gh issue create --repo xinquan568/vibe-suite \
            --title "$title" \
            --body "PR quota exhausted with verified findings remaining for $REPO. Tracked here on our own repository — never as issues on the target."
          echo "umbrella: created"
          # /stage-logic
      - name: route the terminal outcome
        run: |
          # logic:finalize
          # The outcome row is selected from the stage artifacts — last non-empty in stage order —
          # so an empty patch set, a patch conflict, a pre-PR failure and a partial submission stay
          # distinguishable. The durable record is written AND pushed before any issue transition.
          set -euo pipefail
          REPO="${REPO:-}"
          OWN_REPO="${OWN_REPO:-xinquan568/vibe-suite}"
          ISSUE="${ISSUE_NUMBER:-${ISSUE:-}}"
          DATA_DIR="${DATA_DIR:-_data}"
          DATA_BRANCH="${DATA_BRANCH:-$(git -C "$DATA_DIR" rev-parse --abbrev-ref HEAD 2>/dev/null || echo auditor-data)}"
          EVENT_LOG="${EVENT_LOG:-$DATA_DIR/ledgers/events.jsonl}"
          OUTCOME_DIR="${OUTCOME_DIR:-_outcomes}"
          DECISION="${DECISION:-}"
          job=""
          status=""
          reason=""
          ids="{}"
          for s in gates reserve propose submit; do
            f="$OUTCOME_DIR/outcome-$s.json"
            if [ ! -s "$f" ]; then continue; fi
            st=$(jq -r '.status // ""' "$f" 2>/dev/null || echo "")
            if [ -z "$st" ]; then continue; fi
            job=$(jq -r '.job // ""' "$f" 2>/dev/null || echo "")
            if [ -z "$job" ]; then job="$s"; fi
            status="$st"
            reason=$(jq -r '.reason // ""' "$f" 2>/dev/null || echo "")
            ids=$(jq -c '.ids // {}' "$f" 2>/dev/null || echo '{}')
          done
          side_exit=""
          if [ -n "$DECISION" ] && [ -f "$DECISION" ]; then
            side_exit=$(jq -r '.side_exit_label // ""' "$DECISION" 2>/dev/null || echo "")
          fi
          if [ -z "$status" ]; then
            if [ -n "$DECISION" ] && [ -f "$DECISION" ] \
                && [ "$(jq -r '.proceed' "$DECISION" 2>/dev/null)" = "false" ]; then
              job=gates
              status=skip
              reason=$(jq -r '.reason // ""' "$DECISION" 2>/dev/null || echo "")
            else
              job="${OUTCOME_JOB:-gates}"
              status="${OUTCOME_STATUS:-pass}"
              reason="${OUTCOME_REASON:-}"
            fi
          fi
          echo "ROW:$job:$status:${reason:-none}"
          label=""
          event=""
          security=0
          fail=0
          remove_approved=0
          case "$status" in
            pass|reserved|patches)
              echo "NOOP:finalize — no terminal row applies; the pipeline is still in flight"
              exit 0
              ;;
            skip)
              case "$reason" in
                security-*)
                  security=1
                  label="security-blocked"
                  ;;
                *)
                  label="${side_exit:-policy-$reason}"
                  event="contribution_refused"
                  ;;
              esac
              ;;
            capped)
              label="policy-weekly-cap"
              event="contribution_refused"
              if [ -z "$reason" ]; then reason="weekly-cap"; fi
              ;;
            no-patches)
              label="no-actionable-patches"
              event="contribution_refused"
              ;;
            refused)
              label="policy-discuss-first"
              event="contribution_refused"
              ;;
            conflict)
              label="patch-conflict"
              event="contribution_refused"
              ;;
            pre-pr-failure)
              label="pipeline-error"
              event="contribution_error"
              ;;
            partial-persisted)
              event="contribution_partial"
              ;;
            submitted)
              label="prs-submitted"
              event="contribution_submitted"
              remove_approved=1
              ;;
            error)
              if [ "$job" = "submit" ]; then
                event="contribution_submitted"
              else
                label="pipeline-error"
                event="contribution_error"
              fi
              fail=1
              ;;
            *)
              label="pipeline-error"
              event="contribution_error"
              fail=1
              ;;
          esac
          if [ "$security" = "1" ]; then
            if [ -n "${DISCLOSURE_CONTACT:-}" ]; then
              event="disclosure_filed"
            else
              event="disclosure_pending"
            fi
          fi
          data=$(jq -nc --arg repo "$REPO" --arg reason "$reason" --arg stage "$job" \
            --argjson ids "$ids" \
            '{repo: $repo, stage: $stage}
             + (if $reason == "" then {} else {reason: $reason} end)
             + $ids')
          if [ "$status" = "pre-pr-failure" ]; then
            data=$(printf '%s' "$data" | jq -c '. + {phase: "pre-pr"}')
          fi
          mkdir -p "$(dirname "$EVENT_LOG")"
          jq -nc --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg ev "$event" \
            --arg rid "${GITHUB_RUN_ID:-local}" --argjson rn "${GITHUB_RUN_NUMBER:-0}" \
            --argjson d "$data" \
            '{timestamp: $ts, workflow: "auditor-contribute", event: $ev, run_id: $rid,
              run_number: $rn, data: $d}' >> "$EVENT_LOG"

          # F5: the disclosure set is DOWNLOADED here — and downloading it is not acting on
          # it. Its outcome was inferred from `reason: security-*` above, which only fires
          # when the whole run was BLOCKED. So the ordinary case — a run producing both
          # patchable findings and critical security ones — completed, opened its public PR,
          # and the disclosure set vanished with no durable record anywhere.
          #
          # A contribution outcome and a disclosure outcome are independent facts about one
          # run, so they get independent rows. This is appended BEFORE the push below, so it
          # is committed by the same commit that carries the contribution row.
          # F7: an orphan record that submit could not push itself. It arrives as an
          # outcome-* artifact and is replayed into the ledger here, ahead of the commit and
          # push below, so the never-delete policy still leaves something behind.
          ORPHAN_RELAY="${ORPHAN_RELAY:-$OUTCOME_DIR/orphaned-fork.json}"
          if [ -s "$ORPHAN_RELAY" ]; then
            if jq -e '.event == "orphaned_fork"' "$ORPHAN_RELAY" >/dev/null 2>&1; then
              if ! grep -qF "$(jq -r '.data.fork_slug' "$ORPHAN_RELAY")" "$EVENT_LOG" 2>/dev/null
              then
                jq -c . "$ORPHAN_RELAY" >> "$EVENT_LOG"
                echo "ORPHAN:$(jq -r '.data.fork_slug' "$ORPHAN_RELAY") — relayed record persisted here; the fork is NOT deleted"
              fi
            else
              echo "REFUSE:orphan-relay-malformed — an orphaned-fork relay arrived that does not parse; refusing to drop it silently" >&2
              exit 1
            fi
          fi

          DISCLOSURE="${DISCLOSURE:-${GITHUB_WORKSPACE:-$PWD}/disclosure.json}"
          disclosed=0
          if [ -f "$DISCLOSURE" ]; then
            # Refuse rather than drop. An unreadable artifact on the security path is the one
            # case where "carry on and hope" is least acceptable.
            if ! jq -e 'type == "object" and (.findings | type) == "array"' \
                 "$DISCLOSURE" >/dev/null 2>&1; then
              echo "REFUSE:disclosure-malformed — the disclosure artifact does not parse; refusing to drop the security path silently" >&2
              exit 1
            fi
            disclosed="$(jq '.findings | length' "$DISCLOSURE")"
          fi
          if [ "${disclosed:-0}" -gt 0 ]; then
            if [ -n "${DISCLOSURE_CONTACT:-}" ]; then
              disc_event="disclosure_filed"
            else
              disc_event="disclosure_pending"
            fi
            # Carry the fingerprints: without them the row records that something was
            # disclosed but not what, and cannot be joined back to the findings.
            disc_data="$(jq -c --arg repo "$REPO" --arg stage "$job" \
              '{repo: $repo, stage: $stage, disclosed_count: (.findings | length),
                fingerprints: [.findings[].fingerprint]}' "$DISCLOSURE")"
            jq -nc --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg ev "$disc_event" \
              --arg rid "${GITHUB_RUN_ID:-local}" --argjson rn "${GITHUB_RUN_NUMBER:-0}" \
              --argjson d "$disc_data" \
              '{timestamp: $ts, workflow: "auditor-contribute", event: $ev, run_id: $rid,
                run_number: $rn, data: $d}' >> "$EVENT_LOG"
            echo "DISCLOSE:$REPO — $disclosed finding(s) on the responsible-disclosure path; never a public PR"
          fi
          pushed=0
          if git -C "$DATA_DIR" rev-parse --git-dir >/dev/null 2>&1; then
            git -C "$DATA_DIR" add -A
            if ! git -C "$DATA_DIR" diff --cached --quiet; then
              git -C "$DATA_DIR" -c "user.name=${GIT_AUTHOR_NAME:-vibe-suite auditor}" \
                -c "user.email=${GIT_AUTHOR_EMAIL:-auditor@users.noreply.github.com}" \
                commit -q -m "auditor: record $event for ${REPO:-the audited repo}"
            fi
            # The credential is supplied ONLY when a token exists. Three constraints meet at
            # this line: it must authenticate against GitHub (the checkouts set
            # `persist-credentials: false`, so a bare push fails at the end, after the work);
            # it must still work against a LOCAL BARE remote, which needs no auth and where an
            # empty helper makes git prompt for a password nobody can supply; and it must be
            # self-contained, because the composition tests extract this marked block alone —
            # a helper function defined elsewhere in the job is not in scope here.
            #
            # Hence the arg ARRAY: empty when there is no token, so the command degrades to a
            # plain push rather than to a broken one.
            # The credential is meaningful only for an https remote. A local or file://
            # remote — what the harnesses and any bare fork use — needs none, and forcing
            # an empty helper onto one makes git prompt for a password nobody can supply.
            # Discriminating on the TOKEN was wrong: a harness can hold a token and still
            # push locally.
            CRED_ARGS=()
            case "${PUSH_REMOTE_URL:-$(git -C "${PUSH_DIR:-.}" remote get-url origin 2>/dev/null)}" in
              https://*) : ;;
              *) PAT_SECRET="" ;;
            esac
            if [ -n "${PAT_SECRET:-${GH_TOKEN_HTTPS:-}}" ]; then
              CRED_ARGS=(-c 'credential.helper=' \
                -c 'credential.helper=!f() { echo "username=x-access-token"; echo "password=${GIT_AUTH_TOKEN}"; }; f')
            fi
            if GIT_AUTH_TOKEN="${PAT_SECRET:-${GH_TOKEN:-}}" \
               git "${CRED_ARGS[@]}" -C "$DATA_DIR" push -q origin "HEAD:$DATA_BRANCH" 2>/dev/null
            then pushed=1; fi
          fi
          if [ "$pushed" != "1" ]; then
            echo "REFUSE:ledger-unreachable — the durable record could not be pushed; no issue transition is performed" >&2
            exit 1
          fi
          if [ -n "$ISSUE" ] && [ -n "$label" ]; then
            if [ "$remove_approved" = "1" ]; then
              gh issue edit "$ISSUE" --repo "$OWN_REPO" \
                --remove-label contribute-approved --add-label "$label"
            else
              gh issue edit "$ISSUE" --repo "$OWN_REPO" --add-label "$label"
            fi
          fi
          if [ -n "$ISSUE" ] && [ "$status" != "submitted" ]; then
            gh issue comment "$ISSUE" --repo "$OWN_REPO" \
              --body "auditor-contribute stopped at stage $job with outcome $status (${reason:-no reason recorded}). The durable record is ledgers/events.jsonl on auditor-data; the label is a derived view of it."
          fi
          if [ "$security" = "1" ]; then
            echo "DISCLOSE:${REPO:-the audited repo} — routed to the responsible-disclosure path; never a public PR"
          fi
          if [ "$fail" = "1" ]; then
            echo "REFUSE:$job-$status — the run fails loudly so a rerun re-derives the label from the authoritative ledger" >&2
            exit 1
          fi
          echo "PASS"
          # /logic
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ needs.gates.outputs.repo }}
          # F1: gates refusing inside derive-context never reaches the guard step, so its
          # outputs are empty precisely on the runs that need routing. The `issues` payload
          # carries the number directly — fall back to it so an early refusal still labels
          # and comments on the tracking issue instead of failing in silence.
          ISSUE_NUMBER: ${{ needs.gates.outputs.issue || github.event.issue.number }}
          DATA_DIR: _data
          OUTCOME_DIR: _outcomes
      - name: publish the finalize outcome
        if: always()
        run: |
          set -euo pipefail
          mkdir -p _outcomes
          jq -n '{schema_version: 1, job: "finalize", status: "routed", reason: "", ids: {}}' \
            > _outcomes/outcome-finalize.json
          echo "OUTCOME:finalize:routed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outcome-finalize
          path: _outcomes/outcome-finalize.json
          if-no-files-found: warn
