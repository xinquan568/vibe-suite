          # E8.2b (vibe-164) W5.2/W5.3. The COMPLETE invariant, re-confirmed after creation
          # and before any remote is configured. All four parts, each refusing by name.
          #
          # A failed check NEVER deletes the fork. Deleting a repository under a third-party
          # account is not an action this pipeline takes on its own judgement (operator
          # policy, 2026-08-07), so the failure is recorded as an orphaned_fork ledger entry
          # and handed to a human. SCHEMAS.md section 7 declares the record; this writes it.
