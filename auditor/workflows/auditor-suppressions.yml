# ported from the nlpm auditor at capability parity
# auditor-suppressions — weekly scan of public GitHub code search for
# third-party committed configs that suppress or override vibe-suite audit
# rules. Untrusted content, parsed deterministically with jq — never fed to a
# model (the reference installed a YAML library at run start; this port keeps
# parsing inside jq so no runtime dependency install is needed). Search failure
# is fail-soft — partial results are still recorded, and the failure is
# surfaced as its own event so the daily report can flag the scan incomplete.
name: auditor-suppressions
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auditor-suppressions
  cancel-in-progress: false
env:
  CODE_DIR: ${{ github.workspace }}
  DATA_DIR: ${{ github.workspace }}/_data
  REGISTRY: ${{ github.workspace }}/_data/registry/repos.json
  EVENT_LOG: ${{ github.workspace }}/_data/ledgers/events.jsonl
  GH_TOKEN: ${{ github.token }}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      -   uses: actions/checkout@v4
          with:
            ref: auditor-data
            path: _data
            persist-credentials: false
      - name: Scan for downstream suppressions
        run: |
          # One downstream-suppression event per discovered override goes to
          # the disagreements ledger so rule refinement sees where the
          # community disagrees with rules.
          # logic:suppressions
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          [ -f "$REGISTRY" ] || { echo "REFUSE:registry-missing"; exit 1; }
          LEDGERS="$DATA_DIR/ledgers"
          mkdir -p "$LEDGERS"
          DISAGREE="$LEDGERS/disagreements.jsonl"
          [ -f "$DISAGREE" ] || : > "$DISAGREE"
          SEARCH_OK="true"
          RESULTS=""
          if ! RESULTS="$(gh api -X GET search/code -f q='vibe-suite-audit rule override in:file filename:.vibe-suite-audit.yml' 2> /dev/null)"; then
            SEARCH_OK="false"
          fi
          TOTAL="$(printf '%s' "$RESULTS" | jq -r '.total_count // 0' 2> /dev/null || echo 0)"
          TOTAL="${TOTAL:-0}"
          INCOMPLETE="$(printf '%s' "$RESULTS" | jq -r '.incomplete_results // false' 2> /dev/null || echo false)"
          INCOMPLETE="${INCOMPLETE:-false}"
          FOUND=0
          if [ "$TOTAL" != "0" ]; then
            while IFS= read -r item; do
              [ -n "$item" ] || continue
              fp="$(printf '%s' "$item" | jq -r '((.repository.full_name // "unknown") + "|" + (.path // ""))' | shasum -a 256 | cut -d' ' -f1)"
              if jq -e --arg f "$fp" 'select(.event == "downstream_suppression" and .fingerprint == $f)' "$DISAGREE" > /dev/null 2>&1; then
                continue
              fi
              printf '%s\n' "$item" | jq -c --arg t "$TS" --arg f "$fp" \
                '{event: "downstream_suppression", timestamp: $t, repo: (.repository.full_name // "unknown"), path: (.path // ""), sha: (.sha // ""), fingerprint: $f}' >> "$DISAGREE"
              FOUND=$((FOUND+1))
            done < <(printf '%s' "$RESULTS" | jq -c '.items[]?' 2> /dev/null || true)
          fi
          if [ "$SEARCH_OK" != "true" ] || [ "$INCOMPLETE" = "true" ]; then
            jq -cn --arg t "$TS" '{event: "suppression_search_failed", timestamp: $t}' >> "$EVENT_LOG"
          fi
          jq -cn --arg t "$TS" --argjson n "$FOUND" \
            '{event: "suppression_scan_complete", timestamp: $t, found: $n}' >> "$EVENT_LOG"
          echo "PASS"
          # /logic
      - run: |
          set -euo pipefail
          cd "$DATA_DIR"
          # deferred:E8.3 — protected-path guard lands with the scripts item
          if [ -x "$CODE_DIR/auditor/scripts/guard-protected-paths.sh" ]; then
            bash "$CODE_DIR/auditor/scripts/guard-protected-paths.sh"
          else
            echo "REFUSE:guard-helper-missing-until-E8.3"
            exit 1
          fi
          git add ledgers/disagreements.jsonl ledgers/events.jsonl
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "vibe-suite-auditor"
          git config user.email "auditor@users.noreply.github.com"
          git commit -m "auditor-suppressions append downstream suppression events"
          # deferred:E8.3 — retrying push helper lands with the scripts item
          if [ -x "$CODE_DIR/auditor/scripts/git-push-with-retry.sh" ]; then
            bash "$CODE_DIR/auditor/scripts/git-push-with-retry.sh"
          else
            echo "REFUSE:push-helper-missing-until-E8.3"
            exit 1
          fi
