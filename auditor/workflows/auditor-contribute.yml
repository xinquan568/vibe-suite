              echo "REFUSE:pre-pr-failure — the audited SHA is unreachable in the target" >&2
              outcome pre-pr-failure checkout-failed ""
              exit 1
            fi
          fi
          cap="$PATCH_CAP"
          applied=0
          conflict=0
          for p in "$PATCH_DIR"/*.patch; do
            if [ ! -e "$p" ]; then break; fi
            if [ "$applied" -ge "$cap" ]; then
              echo "cap $cap reached; the remaining findings go to the umbrella backstop"
              break
            fi
            abs="$(cd "$(dirname "$p")" && pwd)/$(basename "$p")"
            if git -C "$TARGET_DIR" apply --index "$abs" 2>/dev/null; then
              applied=$((applied+1))
            else
              conflict=1
              echo "CONFLICT:$(basename "$p") — the patch does not apply to the audited tree"
            fi
          done
          if [ "$conflict" -ne 0 ] || [ "$applied" -eq 0 ]; then
            echo "SKIP:patch-conflict — no branch is pushed and no PR is opened for a patch set that does not apply"
            outcome conflict conflict ""
            exit 0
          fi
          tree=$(git -C "$TARGET_DIR" write-tree)
          parent=$(git -C "$TARGET_DIR" rev-parse HEAD)
          commit=$(printf 'fix: %s audited finding(s) reproduced against %s\n' "$applied" "$REPO" \
            | git -C "$TARGET_DIR" commit-tree "$tree" -p "$parent")
          git -C "$TARGET_DIR" branch -f "$BRANCH" "$commit"
          gh repo fork "$REPO" --clone=false --remote=false >/dev/null 2>&1 \
            || echo "the fork already exists; continuing with ${FORK_SLUG:-the configured fork}"
          if [ -z "$FORK_REMOTE" ]; then
            FORK_REMOTE="https://github.com/${FORK_SLUG:-$REPO}.git"
          fi
          # The credential is meaningful only for an https remote. A local or file://
          # remote — what the harnesses and any bare fork use — needs none, and forcing
          # an empty helper onto one makes git prompt for a password nobody can supply.
          # Discriminating on the TOKEN was wrong: a harness can hold a token and still
          # push locally.
          PUSH_REMOTE_URL="$FORK_REMOTE"
          CRED_ARGS=()
          case "${PUSH_REMOTE_URL:-$(git -C "${PUSH_DIR:-.}" remote get-url origin 2>/dev/null)}" in
            https://*) : ;;
            *) PAT_SECRET="" ;;
          esac
          if [ -n "${PAT_SECRET:-${GH_TOKEN_HTTPS:-}}" ]; then
            CRED_ARGS=(-c 'credential.helper=' \
              -c 'credential.helper=!f() { echo "username=x-access-token"; echo "password=${GIT_AUTH_TOKEN}"; }; f')
          fi
          if ! GIT_AUTH_TOKEN="${PAT_SECRET:-${GH_TOKEN:-}}" \
             git "${CRED_ARGS[@]}" -C "$TARGET_DIR" push -q "$FORK_REMOTE" \
