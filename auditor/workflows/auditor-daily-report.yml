# ported from the nlpm auditor at capability parity
# auditor-daily-report — pure observer: reads the registry and the seven
# pipeline label counts, writes a markdown report to the data branch, and
# appends a report_generated event. Label listing always passes an explicitly
# high --limit because the CLI default 30-item page once silently capped a
# label count for the report's entire history. Changes no labels and no
# statuses; the issues permission is deliberately read-only. No model.
name: auditor-daily-report
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: auditor-daily-report
  cancel-in-progress: false
env:
  CODE_DIR: ${{ github.workspace }}
  DATA_DIR: ${{ github.workspace }}/_data
  REGISTRY: ${{ github.workspace }}/_data/registry/repos.json
  EVENT_LOG: ${{ github.workspace }}/_data/ledgers/events.jsonl
  GH_TOKEN: ${{ github.token }}
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: auditor-data
          path: _data
          persist-credentials: false
      - name: Generate the daily report
        run: |
          # Any per-label count failure defaults that count to 0; the recent
          # activity query defaults to 0. The 24-hour window is computed with
          # jq so it works on any runner platform.
          # stage-logic:daily-report
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DAY="$(date -u +%Y-%m-%d)"
          [ -f "$REGISTRY" ] || { echo "REFUSE:registry-missing"; exit 1; }
          # vibe-167: the report body is generate-daily-report.py's duty. This block's job
          # shrank to CACHING the live inputs into the helper's --inputs seam, carrying the
          # label census through the activity items, and logging the event with the
          # HELPER'S printed output path — the filename contract is the helper's.
          INPUTS="$(mktemp -d)"
          jq '{total: (.repos | length), by_status: ([.repos[] | .status // "unknown"] | group_by(.) | map({key: .[0], value: length}) | from_entries)}' "$REGISTRY" > "$INPUTS/registry-stats.json"
          jq '[.repos[].prs // {} | to_entries[] | .value.outcome // empty] | group_by(.) | map({key: .[0], value: length}) | from_entries' "$REGISTRY" > "$INPUTS/pr-outcomes.json"
          if [ -f "$DATA_DIR/feedback/log.json" ]; then
            jq '[.rules[]? | {key: .rule_id, value: {findings: (.hits // 0), accepted: ((.merged // 0) + (.applied_separately // 0))}}] | from_entries' "$DATA_DIR/feedback/log.json" > "$INPUTS/rule-health.json"
          fi
          count_label() {
            local raw
            raw="$(gh issue list --label "$1" --state open --limit 1000 --json number --jq 'length' 2> /dev/null || echo 0)"
            case "$raw" in ''|*[!0-9]*) raw=0 ;; esac
            printf '%s' "$raw"
          }
          SINCE="$(jq -rn 'now - 86400 | todate')"
          RECENT="$(gh issue list --state all --search "updated:>=$SINCE" --limit 1000 --json number --jq 'length' 2> /dev/null || echo 0)"
          case "$RECENT" in ''|*[!0-9]*) RECENT=0 ;; esac
          {
            printf '{"item": "generated at %s"}\n' "$TS"
            printf '{"item": "case-study candidates: %s"}\n' "$(jq -r '[.repos[] | select(.case_study_candidate // false)] | length' "$REGISTRY")"
            for label in audit-candidate audit-ready audit-complete contribute-approved prs-submitted case-study-ready complete; do
              printf '{"item": "open %s: %s"}\n' "$label" "$(count_label "$label")"
            done
            printf '{"item": "issues updated in the last 24 hours: %s"}\n' "$RECENT"
            jq -c '.repos | to_entries | sort_by(-(.value.stars // 0)) | .[:5][] | {item: ("top repo " + .key + " (" + ((.value.stars // 0) | tostring) + " stars)")}' "$REGISTRY"
          } | jq -s 'map(.item)' > "$INPUTS/recent-activity.json"
          OUT_PATH="$(python3 "$CODE_DIR/auditor/scripts/generate-daily-report.py" --data-dir "$DATA_DIR" --inputs "$INPUTS" --date "$DAY")"
          rm -rf "$INPUTS"
          REPORT_REL="${OUT_PATH#"$DATA_DIR"/}"
          # §7 envelope via the shared event library — its adoption site (vibe-167)
          . "$CODE_DIR/auditor/scripts/log-event.sh"
          AUDITOR_DATA_DIR="$DATA_DIR" log_event auditor-daily-report report_generated "$(jq -cn --arg p "$REPORT_REL" '{report: $p}')"
          echo "PASS"
          # /stage-logic
      - run: |
          set -euo pipefail
          cd "$DATA_DIR"
          bash "$CODE_DIR/auditor/scripts/guard-protected-paths.sh"
          git add reports ledgers
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "vibe-suite-auditor"
          git config user.email "auditor@users.noreply.github.com"
          git commit -m "auditor-daily-report publish daily report"
          bash "$CODE_DIR/auditor/scripts/git-push-with-retry.sh"
