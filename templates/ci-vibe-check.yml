# vibe-suite CI validation template (F4.4). Copy into .github/workflows/ to activate —
# this file ships as a template; activation is the release gate's decision (P7).
name: vibe-check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  vibe-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Run the deterministic CI validator on the checkout root
        run: python3 bin/vibe-check .
