# vibe-suite CI (E0.1 / vibe-3).
#
# Three jobs: manifest validation, lint (Python + Node, with shell as a separate step), and test
# execution. At scaffold time most discovery sets are empty by design — every job prints what it
# found and exits 0 on zero targets, so "nothing to check" is visibly distinct from a broken matcher.
#
# Discovery must never fail open. `mapfile < <(find ...)` silently discards find's exit status, so a
# discovery error would look identical to an empty result and the job would pass. Every discovery
# below therefore redirects find to a file inside an `if`, which does propagate the exit status, and
# reads null-delimited names so paths with spaces survive.
#
# No model identifiers appear anywhere in this workflow (principle P9): every tool uses its own
# default. POSIX-only (bash/python3/node) — see README.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-validation:
    name: manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Both manifests parse as JSON
        run: |
          set -euo pipefail
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            test -f "$f" || { echo "missing required manifest: $f"; exit 1; }
            jq empty "$f"
            echo "ok: $f parses"
          done

      - name: Manifest semantics
        # The same assertions the shipped suite makes, invoked rather than duplicated so the two
        # cannot drift apart.
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_manifests -v

      - name: Every other JSON file parses
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          if ! find . -name '*.json' -not -path './.git/*' -not -path './node_modules/*' \
                      -not -path './.claude-plugin/*' -print0 > "$tmp"; then
            echo "discovery failed"; rm -f "$tmp"; exit 1
          fi
          mapfile -d '' -t files < "$tmp"; rm -f "$tmp"
          if [ ${#files[@]} -eq 0 ]; then
            echo "no additional JSON files to check"; exit 0
          fi
          printf 'checking %d additional JSON file(s)\n' "${#files[@]}"
          for f in "${files[@]}"; do jq empty "$f"; done

  lint:
    name: lint (python + node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Python syntax
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          if ! find . -name '*.py' -not -path './.git/*' -print0 > "$tmp"; then
            echo "discovery failed"; rm -f "$tmp"; exit 1
          fi
          mapfile -d '' -t files < "$tmp"; rm -f "$tmp"
          if [ ${#files[@]} -eq 0 ]; then
            echo "no Python files to check"; exit 0
          fi
          printf 'checking %d Python file(s)\n' "${#files[@]}"
          python3 -m py_compile "${files[@]}"

      - name: Node syntax
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          if ! find . \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) \
                      -not -path './.git/*' -not -path './node_modules/*' -print0 > "$tmp"; then
            echo "discovery failed"; rm -f "$tmp"; exit 1
          fi
          mapfile -d '' -t files < "$tmp"; rm -f "$tmp"
          if [ ${#files[@]} -eq 0 ]; then
            echo "no Node files to check"; exit 0
          fi
          printf 'checking %d Node file(s)\n' "${#files[@]}"
          for f in "${files[@]}"; do node --check "$f"; done

      - name: Shell syntax and lint
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          if ! find . -name '*.sh' -not -path './.git/*' -print0 > "$tmp"; then
            echo "discovery failed"; rm -f "$tmp"; exit 1
          fi
          mapfile -d '' -t files < "$tmp"; rm -f "$tmp"
          if [ ${#files[@]} -eq 0 ]; then
            echo "no shell files to check"; exit 0
          fi
          printf 'checking %d shell file(s)\n' "${#files[@]}"
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck "${files[@]}"

      - name: No pinned model identifiers (P9)
        # The pattern set and the scan scope live in the tool, not here. This step previously
        # carried its own copy of the pattern, which drifted from AC-9 with nothing comparing the
        # two: it covered `gpt-<digit>` and `gemini-<digit>` but missed `o<digit>-` and the dated
        # `claude-*-20*` forms entirely, and reported success the whole time (#67, #68).
        #
        # This step runs inside `lint (python + node)` rather than as a job of its own because the
        # three job names are required status contexts on main. A fourth job would not be one, so
        # it could fail without blocking a merge — a gate that exists and does not gate.
        run: |
          set -euo pipefail
          python3 tools/model-pin-lint.py

  loop-bounds:
    name: loop bounds (AC-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # The full suite discovers this module too, so this job adds no coverage — it adds an
      # *attributable signal*. AC-4 is an acceptance criterion in its own right, and a failure buried
      # among 1500 other tests is one nobody reads as "loop bounds regressed".
      #
      # The command is exactly what a contributor runs locally, so the job is reproducible before a
      # push rather than only after one.
      - name: AC-4 loop bounds
        run: python3 -m unittest tests.test_loop_bounds -v

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # vibe-132: the manifest-reproducibility check gates only where the pinned trees
      # exist, and CI checks out none of them — so fetch each at its PINS commit into the
      # runner temp (object database only; --ref regeneration needs no working tree). The
      # pins are read from tools/coverage-check.py, never restated here: two statements
      # of one fact is the defect class this issue exists to end.
      - name: Fetch pinned source trees (vibe-132)
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/pins.txt"
          import importlib.util
          spec = importlib.util.spec_from_file_location("cc", "tools/coverage-check.py")
          cc = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(cc)
          print("\n".join(f"{r} {c}" for r, c in cc.PINS.items()))
          PY
          while read -r repo pin; do
            dir="$RUNNER_TEMP/pinned-trees/$repo"
            git init -q "$dir"
            git -C "$dir" remote add origin "https://github.com/xiaolai/$repo.git"
            if ! git -C "$dir" fetch -q --depth 1 origin "$pin"; then
              # Server policy may refuse an unadvertised SHA: fall back to the remote
              # heads (still no checkout), then require the object outright below.
              git -C "$dir" fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
            fi
            git -C "$dir" cat-file -e "$pin^{commit}"
          done < "$RUNNER_TEMP/pins.txt"

      - name: Run the suite
        env:
          VIBE_SUITE_PINNED_TREES: ${{ runner.temp }}/pinned-trees
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          if ! find tests -name 'test_*.py' -print0 > "$tmp"; then
            echo "test discovery failed"; rm -f "$tmp"; exit 1
          fi
          mapfile -d '' -t files < "$tmp"; rm -f "$tmp"
          if [ ${#files[@]} -eq 0 ]; then
            echo "no tests found under tests/"; exit 0
          fi
          printf 'discovered %d test module(s)\n' "${#files[@]}"
          python3 -m unittest discover -s tests -v

      - name: Run the Node suite
        # A step inside this job rather than a job of its own: the three job names are required
        # status contexts on main, so a fourth job could fail without blocking a merge — a gate that
        # exists and does not gate. As a step it inherits `test`'s required status.
        #
        # The glob is explicit because `--test <dir>` resolves the directory as a module on some Node
        # versions, and because `tests/node/` also holds `no-top-level-await.mjs`, which is a checker
        # invoked with file arguments rather than a test.
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          if ! find tests/node -name '*.test.mjs' -print0 > "$tmp"; then
            echo "node test discovery failed"; rm -f "$tmp"; exit 1
          fi
          mapfile -d '' -t files < "$tmp"; rm -f "$tmp"
          if [ ${#files[@]} -eq 0 ]; then
            echo "no Node tests found under tests/node/"; exit 0
          fi
          printf 'discovered %d Node test file(s)\n' "${#files[@]}"
          node --test "${files[@]}"

  coverage:
    name: coverage (AC-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The three referenced repositories are not checked out here — that is why
      # `tests/source-manifests/*.json` exist. They are unfiltered `git ls-files` snapshots at the
      # pinned commits, and the allowlist and exclusion list are applied by the checker, in one
      # place, so there is no second copy of them to drift.
      - name: Every source artifact is claimed by docs/disposition.yaml
        run: |
          set -euo pipefail
          python3 tools/coverage-check.py
