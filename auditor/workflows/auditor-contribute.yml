            exit 1
          fi
          meta=$(jq -c '{version: 1, findings: [ .[] | {rule_id: .rule_id, fingerprint: .fingerprint} ]}' \
            "$PATCH_META" 2>/dev/null || echo '{"version":1,"findings":[]}')
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "Each change fixes one finding reproduced against this repository at the audited commit." \
            "Every patch carries a three-line Bug / Evidence / Fix summary. Reply here if any change is out of scope — a maintainer 'no' permanently gates further contributions from this bot." \
            "<!-- vibe-suite-auditor-meta-begin $meta vibe-suite-auditor-meta-end -->")
          url=$(gh pr create --repo "$REPO" --base "$BASE_BRANCH" \
            --head "${FORK_SLUG:-$BOT_LOGIN}:$BRANCH" \
            --title "Fixes for $applied audited finding(s)" --body "$body")
          pr_number="$(printf '%s' "$url" | tail -1 | sed 's|.*/||')"
          fi
          # stage-logic:contribute
          # The contribute stage's terminal transition, shared by the normal and the recovery
          # path: filter the audited findings, write the registry and the prs_submitted event,
          # push both to auditor-data, and only then move the issue label. Self-contained, so it
          # runs identically standalone under the harness.
          set -u
          REPO="${REPO:-}"
          if [ -z "$REPO" ] && [ -n "${FIXTURE:-}" ]; then
            REPO="$(jq -r '.repo.full_name' "$FIXTURE")"
          fi
          REGISTRY="${REGISTRY:?}"
          if [ ! -f "$REGISTRY" ]; then
            echo "REFUSE:registry-missing — stages never create the registry (auditor/SCHEMAS.md)" >&2
