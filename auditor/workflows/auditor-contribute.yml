          EVENT_LOG="${EVENT_LOG:-$DATA_DIR/ledgers/events.jsonl}"
          OWN_REPO="${OWN_REPO:-xinquan568/vibe-suite}"
          OUT="${OUTCOME_DIR:-.}"
          ISSUE="${ISSUE_NUMBER:-${ISSUE:-}}"
          if [ -z "$ISSUE" ] && [ -n "${FIXTURE:-}" ]; then
            ISSUE="$(jq -r '.issue.number' "$FIXTURE")"
          fi
          slug=$(printf '%s' "$REPO" | tr '/' '-')
          SIDECAR="${SIDECAR:-$DATA_DIR/audits/$slug.findings.jsonl}"
