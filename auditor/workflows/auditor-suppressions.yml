# ported from the nlpm auditor at capability parity
# auditor-suppressions — weekly scan of public GitHub code search for
# third-party committed configs that suppress or override vibe-suite audit
# rules. Untrusted content: every candidate is fetched at one pinned commit
# SHA and parsed by a deterministic line grammar (shell plus jq only, no
# runtime dependency install, never a model), so the parsed bytes and the
# recorded commit_sha can never disagree. Search failure is fail-soft —
# partial results are still recorded, and the failure is surfaced as its own
# event so the daily report can flag the scan incomplete.
name: auditor-suppressions
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auditor-suppressions
  cancel-in-progress: false
env:
  CODE_DIR: ${{ github.workspace }}
  DATA_DIR: ${{ github.workspace }}/_data
  REGISTRY: ${{ github.workspace }}/_data/registry/repos.json
  EVENT_LOG: ${{ github.workspace }}/_data/ledgers/events.jsonl
  RUN_ID: ${{ github.run_id }}
  RUN_NUMBER: ${{ github.run_number }}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      -   uses: actions/checkout@v4
          with:
            ref: auditor-data
            path: _data
            persist-credentials: false
      - name: Scan for downstream suppressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One downstream-suppression event per discovered override goes to
          # the disagreements ledger so rule refinement sees where the
          # community disagrees with rules. Search, then fetch each candidate
          # at a pinned SHA, then parse, then dedupe, then append.
          # logic:suppressions
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          WF="auditor-suppressions"
          RID="${RUN_ID:-${GITHUB_RUN_ID:-local}}"
          RNUM="${RUN_NUMBER:-${GITHUB_RUN_NUMBER:-0}}"
          case "$RNUM" in ''|*[!0-9]*) RNUM=0 ;; esac
          [ -f "$REGISTRY" ] || { echo "REFUSE:registry-missing"; exit 1; }
          LEDGERS="$DATA_DIR/ledgers"
          mkdir -p "$LEDGERS"
          DISAGREE="$LEDGERS/disagreements.jsonl"
          [ -f "$DISAGREE" ] || : > "$DISAGREE"
          WORK="$(mktemp -d)"
          : > "$WORK/seen"
          FOUND=0
          emit_event() {
            jq -cn --arg t "$TS" --arg w "$WF" --arg e "$1" --arg i "$RID" \
              --argjson n "$RNUM" --argjson d "$2" \
              '{timestamp: $t, workflow: $w, event: $e, run_id: $i, run_number: $n, data: $d}'
          }
          is_rule_id() {
            case "$1" in
              R[0-9][0-9]) return 0 ;;
              SEC-?*|BUG-?*|CC-?*|VOCAB-?*) return 0 ;;
              *) return 1 ;;
            esac
          }
          record() {
            # $1 rule id, $2 suppression type, $3 reason (may be empty).
            # The canonical record identity is repo|path|rule_id|type with the
            # same mandatory trailing newline the other digests fold in.
            RFP="sha256:$(printf '%s|%s|%s|%s\n' "$SRC_REPO" "$SRC_PATH" "$1" "$2" \
              | shasum -a 256 | cut -d' ' -f1)"
            if grep -qxF "$RFP" "$WORK/seen"; then
              return 0
            fi
            printf '%s\n' "$RFP" >> "$WORK/seen"
            if jq -e --arg f "$RFP" 'select(.event == "downstream_suppression" and .data.fingerprint == $f)' "$DISAGREE" > /dev/null 2>&1; then
              return 0
            fi
            jq -cn --arg t "$TS" --arg w "$WF" --arg i "$RID" --argjson n "$RNUM" \
              --arg repo "$SRC_REPO" --arg sha "$SRC_COMMIT" --arg rule "$1" \
              --arg kind "$2" --arg why "$3" --arg p "$SRC_PATH" --arg f "$RFP" \
              '{timestamp: $t, workflow: $w, event: "downstream_suppression", run_id: $i, run_number: $n, data: ({repo: $repo, commit_sha: $sha, rule_id: $rule, suppression_type: $kind, path: $p, fingerprint: $f} + (if $why == "" then {} else {reason_given: $why} end))}' >> "$DISAGREE"
            FOUND=$((FOUND + 1))
          }
          # E8.6 (vibe-63): the SCAN is scan-suppressions.py's — pagination with the
          # incomplete-results refusal, blob-addressed fetch, the shared
          # parse-suppressions grammar, and (repo, sha, path) dedupe into the corpus at
          # feedback/suppressions.jsonl, the dataset rule-health's metrics consume. The
          # inline search/fetch/grammar this replaces produced disagreements but never the
          # corpus. This block keeps the ledger duties, derived from the helper's
          # STRUCTURED records (never re-parsed): one downstream_suppression per override
          # kind, with the SCHEMAS section-5 enum, a per-repo resolved commit_sha, and the
          # existing fingerprint identity; plus the summary event.
          CORPUS="$DATA_DIR/feedback/suppressions.jsonl"
          BEFORE=0
          if [ -f "$CORPUS" ]; then
            BEFORE="$(wc -l < "$CORPUS" | tr -d ' ')"
          fi
          if ! python3 "$CODE_DIR/auditor/scripts/scan-suppressions.py" \
              --data-dir "$DATA_DIR" --host-repo "${GITHUB_REPOSITORY:?}" --apply; then
            emit_event suppression_search_failed \
              '{"search_ok": false, "partial": true}' >> "$EVENT_LOG"
            echo "REFUSE:suppressions-scan-failed — the corpus would be partial; nothing derived" >&2
            rm -rf "$WORK"
            exit 1
          fi
          AFTER=0
          if [ -f "$CORPUS" ]; then
            AFTER="$(wc -l < "$CORPUS" | tr -d ' ')"
          fi
          NEW=$((AFTER - BEFORE))
          if [ "$NEW" -gt 0 ]; then
            tail -n +"$((BEFORE + 1))" "$CORPUS" > "$WORK/new.jsonl"
            while IFS= read -r rec; do
              [ -n "$rec" ] || continue
              SRC_REPO="$(printf '%s' "$rec" | jq -r '.repo // ""')"
              SRC_PATH="$(printf '%s' "$rec" | jq -r '.path // ""')"
              if [ -z "$SRC_REPO" ] || [ -z "$SRC_PATH" ]; then
                continue
              fi
              SRC_COMMIT="$(gh api "repos/$SRC_REPO/commits" -X GET -f per_page=1 --jq '.[0].sha // empty' 2> /dev/null | head -n 1 || true)"
              if [ -z "$SRC_COMMIT" ]; then
                # no resolvable commit means no honest commit_sha; fail soft on this
                # record rather than deriving an unpinned override
                continue
              fi
              printf '%s' "$rec" | jq -c '.overrides[]?' > "$WORK/overrides.jsonl" || : > "$WORK/overrides.jsonl"
              while IFS= read -r ov; do
                [ -n "$ov" ] || continue
                RULE="$(printf '%s' "$ov" | jq -r '.rule_id // ""')"
                if [ -z "$RULE" ] || ! is_rule_id "$RULE"; then
                  continue
                fi
                REASON="$(printf '%s' "$ov" | jq -r '.override.reason // ""')"
                for KEY in suppress max_penalty threshold override; do
                  if printf '%s' "$ov" | jq -e --arg k "$KEY" '.override | has($k)' > /dev/null 2>&1; then
                    case "$KEY" in
                      suppress) KIND=suppress ;;
                      max_penalty) KIND=max_penalty ;;
                      threshold) KIND=threshold_adjustment ;;
                      override) KIND=rule_override ;;
                    esac
                    record "$RULE" "$KIND" "$REASON"
                  fi
                done
              done < "$WORK/overrides.jsonl"
            done < "$WORK/new.jsonl"
          fi
          emit_event suppression_scan_complete "$(jq -cn --argjson f "$FOUND" --argjson n "$NEW" \
            '{found: $f, new_records: $n}')" >> "$EVENT_LOG"
          rm -rf "$WORK"
          echo "PASS"
          # /logic
      -   name: Commit new suppression events
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            set -euo pipefail
            cd "$DATA_DIR"
            bash "$CODE_DIR/auditor/scripts/guard-protected-paths.sh"
            git add ledgers/disagreements.jsonl ledgers/events.jsonl feedback/suppressions.jsonl
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git config user.name "vibe-suite-auditor"
            git config user.email "auditor@users.noreply.github.com"
            git commit -m "auditor-suppressions append downstream suppression events"
            bash "$CODE_DIR/auditor/scripts/git-push-with-retry.sh"
