# ported from the nlpm auditor at capability parity
# auditor-cite-exemplars — "Propose Rule Citations". Weekly, one hour after
# refine-rules, and explicitly deterministic: no model, the edits are
# mechanical. Check mode scans exemplar frontmatter for exemplifies fields
# and emits the proposal list; apply mode inserts marker-wrapped real-world
# example citation blocks into the rules catalog on a dated branch and opens
# a human-review PR. Rulebook citations never auto-merge; idempotent marker
# anchors make re-runs update in place instead of stacking duplicates.
name: auditor-cite-exemplars
on:
  schedule:
    - cron: "0 10 * * 0"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: auditor-cite-exemplars
  cancel-in-progress: false
env:
  CODE_DIR: ${{ github.workspace }}
  DATA_DIR: ${{ github.workspace }}/_data
  # S-4: absolute links into this repository's auditor-data branch. Derived here
  # rather than left to the helper's fallback so the value is visible in the run
  # log next to the commit it produced.
  VIBE_EXEMPLAR_URL_PREFIX: https://github.com/${{ github.repository }}/blob/auditor-data/exemplars
  REGISTRY: ${{ github.workspace }}/_data/registry/repos.json
  EVENT_LOG: ${{ github.workspace }}/_data/ledgers/events.jsonl
  GH_TOKEN: ${{ github.token }}
jobs:
  cite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: auditor-data
          path: _data
          persist-credentials: false
      - name: Check citation drift
        run: |
          # Check mode of the check/apply contract: read-only over the code
          # checkout, writes only the proposal list under the data dir.
          # Exits by printing SKIP when there is nothing to apply; the apply
          # step below is gated on the proposal list existing and non-empty.
          # logic:cite-exemplars
          set -euo pipefail
          if [ ! -f "$REGISTRY" ]; then
            echo "REFUSE:registry-missing"
            exit 1
          fi
          OPEN_COUNT="$(gh pr list --state open --label exemplar-citation-proposal | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "${OPEN_COUNT:-0}" -gt 0 ]; then
            echo "SKIP:open-proposal-exists"
            exit 0
          fi
          EXDIR="$DATA_DIR/exemplars"
          PROPOSALS="$DATA_DIR/ledgers/citation-proposals.txt"
          mkdir -p "$DATA_DIR/ledgers"
          : > "$PROPOSALS"
          FILES=0
          FOUND=0
          for f in "$EXDIR"/*.md; do
            if [ ! -e "$f" ]; then
              continue
            fi
            base="$(basename "$f")"
            if [ "$base" = "README.md" ]; then
              continue
            fi
            FILES=$((FILES+1))
            # BOTH shapes the exemplar workflow documents. Reading only the text ON the
            # `exemplifies:` line yields nothing for a block list, so FILES counts the file,
            # FOUND stays 0, the proposals file is deleted and the run prints SKIP:in-sync —
            # a clean, confident "no citation drift" for a corpus full of exemplars.
            FM="$(sed -n '/^---$/,/^---$/p' "$f")"
            # `\?` is a GNU sed extension and is literal on BSD sed, so the brackets are
            # stripped with tr instead — the runner is Ubuntu, which would have hidden this.
            RULES="$(printf '%s\n' "$FM" | sed -n 's/^exemplifies:[ ]*//p' | tr -d '[]' | tr ',' ' ')"
            if [ -z "$(printf '%s' "$RULES" | tr -d '[:space:]')" ]; then
              RULES="$(printf '%s\n' "$FM" | awk '/^exemplifies:[ ]*$/{f=1;next} f&&/^[ ]*-[ ]+/{sub(/^[ ]*-[ ]+/,"");print;next} f&&/^[^ ]/{f=0}')"
            fi
            for rule in $RULES; do
              if [ -z "$rule" ]; then
                continue
              fi
              printf 'PROPOSE:%s <- exemplars/%s\n' "$rule" "$base" >> "$PROPOSALS"
              FOUND=$((FOUND+1))
            done
          done
          if [ "$FILES" -eq 0 ]; then
            rm -f "$PROPOSALS"
            echo "SKIP:no-exemplars"
            exit 0
          fi
          if [ "$FOUND" -eq 0 ]; then
            rm -f "$PROPOSALS"
            echo "SKIP:in-sync"
            exit 0
          fi
          cat "$PROPOSALS"
          echo "PASS"
          # /logic
      - run: |
          # Apply mode: only runs when check mode left a non-empty proposal
          # list. Edits the rules catalog on a dated branch and opens the
          # human-review PR; this workflow never merges anything itself.
          set -euo pipefail
          PROPOSALS="$DATA_DIR/ledgers/citation-proposals.txt"
          if [ ! -s "$PROPOSALS" ]; then
            echo "no citation drift; nothing to apply"
            exit 0
          fi
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="exemplar-citations/$DATE"
          cd "$CODE_DIR"
          git checkout -b "$BRANCH"
          # propose-rule-citations.py IS the applier — `--apply` writes the blocks into the
          # rulebook. There was never a separate shell helper; the seam here named one that
          # E8.3's closed thirty does not contain and never would, so it refused on every run.
          #
          # The prefix names THIS repository, the one holding skills/rules/SKILL.md and the
          # auditor-data branch — not the audited repository an exemplar is about.
          python3 "$CODE_DIR/auditor/scripts/propose-rule-citations.py" \
            --apply \
            --data-dir "$DATA_DIR" \
            --rules-path "$CODE_DIR/skills/rules/SKILL.md" \
            --exemplar-url-prefix "$VIBE_EXEMPLAR_URL_PREFIX"
          git config user.name "vibe-suite-auditor"
          git config user.email "auditor@users.noreply.github.com"
          git commit -am "auditor-cite-exemplars refresh rule citations for $DATE"
          # Both checkouts use `persist-credentials: false`, so there is no ambient credential
          # and a bare `git push` fails after all the work is done. The token is supplied
          # through a credential helper reading it from the ENVIRONMENT, so it never lands in
          # argv (where `ps` shows it), in .git/config, or in a remote URL — the same ephemeral
          # discipline commit-via-pr.sh uses.
          #
          # The single quotes are required: ${GIT_AUTH_TOKEN} must reach git and expand THERE.
          GIT_AUTH_TOKEN="$GH_TOKEN" git \
            -c 'credential.helper=' \
            -c 'credential.helper=!f() { echo "username=x-access-token"; echo "password=${GIT_AUTH_TOKEN}"; }; f' \
            push origin "$BRANCH"
          BODY="$DATA_DIR/ledgers/citation-pr-body.md"
          printf '%s\n' \
            "Weekly exemplar citation refresh for $DATE." \
            "" \
            "Every edit is a marker-wrapped real-world-example block in the rules catalog; marker anchors keep re-runs idempotent." \
            "" \
            "Review checklist" \
            "- [ ] each citation resolves to a published exemplar on the auditor-data branch" \
            "- [ ] no rule text outside the markers changed" \
            "- [ ] never auto-merge; a maintainer merges this by hand" \
            > "$BODY"
          gh pr create --title "auditor refresh of exemplar citations ($DATE)" --label exemplar-citation-proposal --body-file "$BODY"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
