              if [ -z "$line" ]; then continue; fi
              conf=$(printf '%s' "$line" | jq -r '.confidence // "medium"' 2>/dev/null) || continue
              if [ "$conf" != "high" ]; then continue; fi
              if printf '%s' "$line" | jq -e 'select(.category=="security")
                  | select(.severity=="critical" or .severity=="high")' >/dev/null 2>&1; then
                echo "DISCLOSE:$(printf '%s' "$line" | jq -r '.rule_id')"
                continue
              fi
