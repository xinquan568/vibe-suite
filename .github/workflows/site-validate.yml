# Site validation on every pull request (E8.4 / vibe-61).
#
# Builds the site through `site/build.sh` (I2b) and then scans what the build actually
# produced. The generated directories are gitignored (D-D), so `tools/legacy-string-sweep.sh`
# and any scan over tracked files are structurally blind to them: a foreign brand string that
# enters through a builder template or a rendered page appears only in the build output. This
# workflow is where that output is read — a post-build scan is the only scan that can see it.
#
# Both scans run: the tracked sources under `site/`, and the built directory. They catch
# different defects — a bad string in a page source, and one a builder synthesized — and
# neither subsumes the other.
#
# The job holds `contents: read` alone: it validates and reports, and publishes nothing.
#
# No model identifiers appear in this workflow (principle P9).

name: site-validate

on:
  pull_request:

permissions: {}

concurrency:
  group: site-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SITE_CORPUS: auditor-data
  SITE_OUT: site
  SITE_DIST: site/.vitepress/dist

jobs:
  validate:
    name: build and validate the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.x'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 'lts/*'

      - name: Install the site toolchain
        run: npm ci
        working-directory: site

      - name: Build through the single entry point (I2b)
        run: |
          set -euo pipefail
          bash site/build.sh --corpus "$SITE_CORPUS" --out "$SITE_OUT"

      - name: The build actually produced a site
        # Asserted before the scans, so a clean brand-check result can never be the trivial
        # consequence of an empty directory.
        run: |
          set -euo pipefail
          if [ ! -d "$SITE_DIST" ]; then
            echo "no build output at $SITE_DIST"; exit 1
          fi
          if [ ! -f "$SITE_DIST/index.html" ]; then
            echo "$SITE_DIST has no index.html"; exit 1
          fi
          printf 'built %d file(s)\n' "$(find "$SITE_DIST" -type f | wc -l)"

      - name: Brand check over the tracked site sources (D-A)
        run: |
          set -euo pipefail
          bash tools/site-brand-check.sh site

      - name: Brand check over the built output (D-A)
        run: |
          set -euo pipefail
          bash tools/site-brand-check.sh "$SITE_DIST"

      - name: Orchestrator, brand-check and builder contracts
        # The suites that own these contracts, invoked rather than restated, so this workflow
        # cannot drift from them. test_site_builders' RenderedSite class needs the VitePress
        # toolchain installed above (vibe-196): it skips in CI's `test` job and runs here.
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_site_build_orchestrator tests.test_site_brand tests.test_site_builders -v
