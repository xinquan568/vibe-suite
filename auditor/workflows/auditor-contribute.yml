          # previous run opened the PR and lost the ledger write. Reconcile it — the ONLY permitted
          # bypass of the duplicate-open-PR gate — and never call `gh pr create` again.
          ours="[]"
          if [ -f "$PATCH_META" ]; then
            ours=$(jq -c '[.[] | .fingerprint] | sort' "$PATCH_META" 2>/dev/null || echo '[]')
          fi
          recovered=""
          prs=$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,state,headRefName,author,url,body 2>/dev/null || true)
          if [ -n "${prs:-}" ]; then
            mine=$(printf '%s' "$prs" | jq -c --arg l "$BOT_LOGIN" \
              '[ .[] | select(((.author.login) // "") == $l) ] | first // {}' 2>/dev/null || echo '{}')
            cand_n=$(printf '%s' "$mine" | jq -r '.number // empty' 2>/dev/null || true)
            cand_b=$(printf '%s' "$mine" | jq -r '.body // empty' 2>/dev/null || true)
            meta_seen=$(printf '%s\n' "${cand_b:-}" \
              | sed -n -e 's/.*meta-begin *\([{].*[}]\).*/\1/p' \
                       -e 's/.*auditor-metadata *\([{].*[}]\).*/\1/p' | tail -1)
            if [ -n "$meta_seen" ] && [ -n "${cand_n:-}" ]; then
              seen_fps=$(printf '%s' "$meta_seen" | jq -c '[.findings[].fingerprint] | sort' \
                2>/dev/null || echo '[]')
              if [ "$seen_fps" = "$ours" ]; then recovered="$cand_n"; fi
            fi
          fi
          if [ -n "$recovered" ]; then
            pr_number="$recovered"
            echo "RECOVER:$pr_number — a self-authored sentinel PR already carries these fingerprints; reconciling it instead of opening a second PR"
