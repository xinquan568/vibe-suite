# vibe-suite CI (E0.1 / vibe-3).
#
# Jobs: manifest validation · lint (Python + Node, with shell as a separate step) · loop bounds
# (AC-4) · pinned trees (fetch + cache the pinned upstream trees) · the Python suite sharded
# four ways as `test shard N` and crossed with the documented python/node floors (3.11/3.x,
# 18/lts), fanned in to the required `test` context and publishing advisory code-coverage
# artifacts · coverage (AC-1) · legacy strings (AC-6). vibe-199 (M34) · vibe-200 (M34 b).
# Per branch protection, the required status contexts on main are `manifest validation`, `lint (python + node)`, `test`, and `coverage (AC-1)`.
# The loop-bounds and legacy-strings jobs are advisory attributable duplicates of checks that also
# run inside the `test shard` jobs — kept for attributable signal, not extra coverage; their
# failure does not block a merge.
#
# At scaffold time most discovery sets were empty by design — every job prints what it
# found and exits 0 on zero targets, so "nothing to check" is visibly distinct from a broken matcher.
#
# Discovery must never fail open. `mapfile < <(find ...)` silently discards find's exit status, so a
# discovery error would look identical to an empty result and the job would pass. Every discovery
# below therefore redirects find to a file inside an `if`, which does propagate the exit status, and
# reads null-delimited names so paths with spaces survive.
#
# No model identifiers appear anywhere in this workflow (principle P9): every tool uses its own
# default. POSIX-only (bash/python3/node) — see README; the documented floors (python 3.11,
# node 18) and macOS are exercised in CI — macOS runs weekly via self-check.yml.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-validation:
    name: manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Both manifests parse as JSON
        run: |
          set -euo pipefail
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            test -f "$f" || { echo "missing required manifest: $f"; exit 1; }
            jq empty "$f"
            echo "ok: $f parses"
          done

      - name: Manifest semantics
        # The same assertions the shipped suite makes, invoked rather than duplicated so the two
        # cannot drift apart.
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_manifests -v

      - name: Every other JSON file parses
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          if ! find . -name '*.json' -not -path './.git/*' -not -path './node_modules/*' \
                      -not -path './.claude-plugin/*' -print0 > "$tmp"; then
            echo "discovery failed"; rm -f "$tmp"; exit 1
          fi
          mapfile -d '' -t files < "$tmp"; rm -f "$tmp"
          if [ ${#files[@]} -eq 0 ]; then
            echo "no additional JSON files to check"; exit 0
          fi
          printf 'checking %d additional JSON file(s)\n' "${#files[@]}"
          for f in "${files[@]}"; do jq empty "$f"; done

  lint:
    name: lint (python + node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Python syntax
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          if ! find . -name '*.py' -not -path './.git/*' -print0 > "$tmp"; then
            echo "discovery failed"; rm -f "$tmp"; exit 1
          fi
          mapfile -d '' -t files < "$tmp"; rm -f "$tmp"
          if [ ${#files[@]} -eq 0 ]; then
            echo "no Python files to check"; exit 0
          fi
          printf 'checking %d Python file(s)\n' "${#files[@]}"
          python3 -m py_compile "${files[@]}"

      - name: Node syntax
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          if ! find . \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) \
                      -not -path './.git/*' -not -path './node_modules/*' -print0 > "$tmp"; then
            echo "discovery failed"; rm -f "$tmp"; exit 1
          fi
          mapfile -d '' -t files < "$tmp"; rm -f "$tmp"
          if [ ${#files[@]} -eq 0 ]; then
            echo "no Node files to check"; exit 0
          fi
          printf 'checking %d Node file(s)\n' "${#files[@]}"
          for f in "${files[@]}"; do node --check "$f"; done

      - name: Shell syntax and lint
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          if ! find . -name '*.sh' -not -path './.git/*' -print0 > "$tmp"; then
            echo "discovery failed"; rm -f "$tmp"; exit 1
          fi
          mapfile -d '' -t files < "$tmp"; rm -f "$tmp"
          if [ ${#files[@]} -eq 0 ]; then
            echo "no shell files to check"; exit 0
          fi
          printf 'checking %d shell file(s)\n' "${#files[@]}"
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck "${files[@]}"

      - name: No pinned model identifiers (P9)
        # The pattern set and the scan scope live in the tool, not here. This step previously
        # carried its own copy of the pattern, which drifted from AC-9 with nothing comparing the
        # two: it covered `gpt-<digit>` and `gemini-<digit>` but missed `o<digit>-` and the dated
        # `claude-*-20*` forms entirely, and reported success the whole time (#67, #68).
        #
        # This step runs inside `lint (python + node)` rather than as a job of its own because
        # `lint (python + node)` is a required status context on main and a new job would not be,
        # so a standalone job could fail without blocking a merge — a gate that exists and does
        # not gate.
        run: |
          set -euo pipefail
          python3 tools/model-pin-lint.py

  loop-bounds:
    name: loop bounds (AC-4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # The full suite discovers this module too, so this job adds no coverage — it adds an
      # *attributable signal*. AC-4 is an acceptance criterion in its own right, and a failure buried
      # among 1500 other tests is one nobody reads as "loop bounds regressed".
      #
      # The command is exactly what a contributor runs locally, so the job is reproducible before a
      # push rather than only after one.
      - name: AC-4 loop bounds
        run: python3 -m unittest tests.test_loop_bounds -v

  # vibe-199 (M34): the pinned upstream trees are fetched ONCE in a dedicated job and cached, then
  # the Python suite is sharded four ways. `test` stays a SINGLE required status context via the
  # fan-in job below — the matrix produces `test shard N` contexts, which do not gate; the `test`
  # job `needs` every shard and is green only when all four succeed, so branch protection is
  # unchanged (no new required context; the required `test` context still means "all tests passed").
  pinned-trees:
    name: pinned trees
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Restore keyed on the PINS in tools/coverage-check.py (the single source). The key is
      # immutable, so a poisoned (incomplete) entry would persist — this job is the ONLY writer and
      # saves ONLY a proven-complete tree set (below), so racing shards can never save a partial one.
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: ${{ runner.temp }}/pinned-trees
          key: pinned-trees-${{ hashFiles('tools/coverage-check.py') }}

      # vibe-132: the manifest-reproducibility check gates only where the pinned trees exist, and CI
      # checks out none of them — so fetch each at its PINS commit into the runner temp (object
      # database only). vibe-199: soft-fail — a bad fetch is left for the manifest-reproducibility
      # tests to report, not to red this job; `complete` records whether every pin is present.
      - name: Fetch pinned source trees (vibe-132; soft-fail per vibe-199)
        id: fetch
        run: |
          set -euo pipefail
          # Extracting the pins MUST hard-fail: a broken tools/coverage-check.py or an empty pin
          # list must never be treated as a "complete" tree set and cached under the immutable key.
          python3 - <<'PY' > "$RUNNER_TEMP/pins.txt"
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("cc", "tools/coverage-check.py")
          cc = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(cc)
          pins = getattr(cc, "PINS", None)
          # Hard-fail (nonzero, aborting the step under `set -e`) on an empty or malformed pin
          # set BEFORE printing — an empty mapping would otherwise print one blank line, pass the
          # `-s` guard, and let the job "succeed" with nothing to cache.
          if not isinstance(pins, dict) or not pins:
              sys.exit("PINS is empty or not a mapping — refusing to proceed with no pins")
          for r, c in pins.items():
              if not (isinstance(r, str) and r.strip() and isinstance(c, str) and c.strip()):
                  sys.exit(f"invalid PINS entry: {r!r} {c!r}")
          print("\n".join(f"{r} {c}" for r, c in pins.items()))
          PY
          [ -s "$RUNNER_TEMP/pins.txt" ] || { echo "no pins extracted from tools/coverage-check.py"; exit 1; }
          set +e   # from here individual network fetches may fail softly; `complete` records the outcome
          complete=true; count=0
          while read -r repo pin; do
            count=$((count + 1))
            dir="$RUNNER_TEMP/pinned-trees/$repo"
            if git -C "$dir" cat-file -e "$pin^{commit}" 2>/dev/null; then
              echo "present: $repo $pin"; continue
            fi
            git init -q "$dir"
            git -C "$dir" remote add origin "https://github.com/xiaolai/$repo.git" 2>/dev/null || true
            git -C "$dir" fetch -q --depth 1 origin "$pin" \
              || git -C "$dir" fetch -q origin '+refs/heads/*:refs/remotes/origin/*' \
              || echo "warning: could not fetch $repo $pin"
            git -C "$dir" cat-file -e "$pin^{commit}" 2>/dev/null || { echo "MISSING after fetch: $repo $pin"; complete=false; }
          done < "$RUNNER_TEMP/pins.txt"
          # `complete` is true only when at least one pin was enumerated and every one is present.
          [ "$count" -gt 0 ] || complete=false
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      # Save only on a cold miss AND a complete tree set — so the immutable key never holds a
      # partial tree, and an unreachable upstream just means "no cache this run", not a poison.
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true' && steps.fetch.outputs.complete == 'true'
        with:
          path: ${{ runner.temp }}/pinned-trees
          key: pinned-trees-${{ hashFiles('tools/coverage-check.py') }}

  test-shard:
    name: test shard ${{ matrix.shard }}
    needs: [pinned-trees]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # vibe-200 (M34 b): the 4 shards are crossed with the documented floors/ceilings —
    # python ['3.11','3.x'] and node ['18','lts/*'] — so the floors are actually EXERCISED. Only
    # shard 0 runs the Node suite, so the node dimension is collapsed to a single value on shards
    # 1-3 (the exclude below) to avoid running identical Python-only work twice. The `test` fan-in
    # still needs only this job, so the required context and branch protection are unchanged.
    strategy:
      fail-fast: false
      matrix:
        shard: ['0', '1', '2', '3']
        python: ['3.11', '3.x']
        node: ['18', 'lts/*']
        exclude:
          - { shard: '1', node: '18' }
          - { shard: '2', node: '18' }
          - { shard: '3', node: '18' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Read-only restore of the trees the pinned-trees job cached. A miss (an incomplete fetch that
      # was not cached) leaves the trees absent, and the manifest-reproducibility tests report it —
      # the deliberate soft-fail path.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pinned-trees
          key: pinned-trees-${{ hashFiles('tools/coverage-check.py') }}

      - name: Run this shard's Python modules
        env:
          VIBE_SUITE_PINNED_TREES: ${{ runner.temp }}/pinned-trees
        run: |
          set -euo pipefail
          # Discovery must never fail open (ci.yml header): redirect find to a file inside an `if`
          # so its exit status propagates, then read null-delimited names and sort.
          tmp=$(mktemp)
          if ! find tests -maxdepth 1 -name 'test_*.py' -print0 > "$tmp"; then
            echo "test discovery failed"; rm -f "$tmp"; exit 1
          fi
          mapfile -d '' -t all < <(sort -z < "$tmp"); rm -f "$tmp"
          if [ ${#all[@]} -eq 0 ]; then echo "no tests found under tests/"; exit 1; fi
          mods=()
          for i in "${!all[@]}"; do
            if [ $(( i % 4 )) -eq "${{ matrix.shard }}" ]; then
              m="${all[$i]}"; m="${m#tests/}"; m="${m%.py}"; mods+=("tests.$m")
            fi
          done
          if [ ${#mods[@]} -eq 0 ]; then echo "shard ${{ matrix.shard }} has no modules"; exit 1; fi
          printf 'shard %s (py%s node%s): %d of %d module(s)\n' \
            "${{ matrix.shard }}" "${{ matrix.python }}" "${{ matrix.node }}" "${#mods[@]}" "${#all[@]}"
          # Code coverage is measured on ONE leg per shard (the ceiling: python 3.x + node lts) and
          # is strictly advisory — the authoritative pass/fail is ALWAYS a plain unittest run, so a
          # coverage-tooling failure can never turn a green suite red (issue: "upload first, gate later").
          if [ "${{ matrix.python }}" = "3.x" ] && [ "${{ matrix.node }}" = "lts/*" ] \
               && python3 -m pip install --quiet coverage 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/cov"
            if python3 -m coverage run --data-file "$RUNNER_TEMP/cov/.coverage.${{ matrix.shard }}" -m unittest -v "${mods[@]}"; then
              echo "shard ${{ matrix.shard }} passed under coverage"
            else
              echo "coverage run exited nonzero — rerunning PLAIN for the authoritative verdict"
              python3 -m unittest -v "${mods[@]}"
            fi
          else
            python3 -m unittest -v "${mods[@]}"
          fi

      - name: Python coverage report (advisory)
        if: ${{ always() && matrix.python == '3.x' && matrix.node == 'lts/*' }}
        continue-on-error: true
        run: |
          python3 -m coverage xml \
            --data-file "$RUNNER_TEMP/cov/.coverage.${{ matrix.shard }}" \
            -o "$RUNNER_TEMP/cov/coverage-shard-${{ matrix.shard }}.xml"

      - name: Upload Python coverage (advisory)
        if: ${{ always() && matrix.python == '3.x' && matrix.node == 'lts/*' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: py-coverage-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/cov/coverage-shard-${{ matrix.shard }}.xml
          if-no-files-found: ignore

      - name: Run the Node suite
        # In shard 0 only, across BOTH its node legs (18 and lts) so both node floors are exercised;
        # it stays within the `test` lineage (the fan-in needs every shard). A nullglob array-glob
        # feeds `node --test` explicitly; the `*.test.mjs` glob skips tests/node/no-top-level-await.mjs.
        if: ${{ matrix.shard == '0' }}
        run: |
          set -euo pipefail   # includes pipefail, so the covered pipeline's node exit propagates
          shopt -s nullglob
          files=(tests/node/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then echo "no Node tests found under tests/node/"; exit 0; fi
          printf 'discovered %d Node test file(s)\n' "${#files[@]}"
          # Advisory coverage, symmetric with the Python path: attempt the covered run; if ANY part
          # of it fails (coverage engine, mkdir, tee), fall back to a PLAIN `node --test` whose
          # result is authoritative — so coverage tooling can never red a green Node suite.
          if { mkdir -p "$RUNNER_TEMP/cov" \
                 && node --test --experimental-test-coverage "${files[@]}" \
                      | tee "$RUNNER_TEMP/cov/node-coverage.txt"; }; then
            echo "Node suite passed under coverage"
          else
            echo "covered Node run failed — rerunning PLAIN for the authoritative verdict"
            node --test "${files[@]}"
          fi

      - name: Upload Node coverage (advisory)
        if: ${{ always() && matrix.shard == '0' && matrix.python == '3.x' && matrix.node == 'lts/*' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          path: ${{ runner.temp }}/cov/node-coverage.txt
          if-no-files-found: ignore

  test:
    name: test
    needs: [test-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All shards passed
        # The single required status context on main. `if: always()` above so this job runs even
        # when a shard fails; it then fails explicitly here — a skipped required check would not
        # gate. `needs.test-shard.result` is "success" only when every matrix shard succeeded. This
        # job checks out nothing and needs no token, so it grants none.
        run: |
          result='${{ needs.test-shard.result }}'
          echo "test-shard result: $result"
          [ "$result" = "success" ] || { echo "a test shard did not succeed"; exit 1; }

  coverage:
    name: coverage (AC-1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The three referenced repositories are not checked out here — that is why
      # `tests/source-manifests/*.json` exist. They are unfiltered `git ls-files` snapshots at the
      # pinned commits, and the allowlist and exclusion list are applied by the checker, in one
      # place, so there is no second copy of them to drift.
      - name: Every source artifact is claimed by docs/disposition.yaml
        run: |
          set -euo pipefail
          python3 tools/coverage-check.py

  legacy-strings:
    name: legacy strings (AC-6)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No retired command namespace in any shipped runtime-reachable string. The sweep's
      # scope is a total SWEPT/EXEMPT partition; an unclassified top-level entry fails the
      # job rather than passing silently.
      - name: AC-6 legacy-string sweep
        run: bash tools/legacy-string-sweep.sh
